<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Stok Bahan Ajar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Stok Bahan Ajar</h2>
<div id="stokList"></div>
<h3>Tambah Stok Baru</h3>

<div class="add-form">
    <input id="lokasi" placeholder="Kode Lokasi">
    <input id="kode" placeholder="Kode Barang">
    <input id="nama" placeholder="Nama Barang">
    <input id="jenis" placeholder="Jenis Barang">
    <input id="edisi" placeholder="Edisi">
    <input id="stok" placeholder="Stok">
    <button class="btn-orange" onclick="tambahStok()">Tambah</button>
</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>

</body>
</html>
